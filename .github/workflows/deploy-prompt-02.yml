name: Deploy Prompt 02 (wellness)

# اجرای دستی deploy پرامپت ۰۲ (migration + آپلود + seed) روی Appwrite production.
# - ۳ گام: migrate → upload assets → seed moves
# - هر گام idempotent است (skip اگر موجود باشد)
# - نیاز به secrets یا env variables دارد (APPWRITE_*)
# - می‌توان با workflow_dispatch دستی اجرا کرد

on:
  workflow_dispatch:
    inputs:
      skip_migration:
        description: 'اگر true، migration را اجرا نکن (فقط upload + seed)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      skip_upload:
        description: 'اگر true، آپلود فایل‌ها را انجام نده (فقط migration + seed)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      skip_seed:
        description: 'اگر true، seed کردن ۴۳ حرکت را انجام نده'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  deploy:
    name: deploy wellness (migrate + upload + seed)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      APPWRITE_ENDPOINT: https://fra.cloud.appwrite.io/v1
      APPWRITE_PROJECT_ID: 6a9d59e3002751cc3ea8
      APPWRITE_API_KEY: standard_3e7b1708ccbd4165c42af6f3570f90ac84aa5f3b2ad39ba06e7e3a4026d30a3e6940adbccac68e4441ab9c64f178af6bccadde6a6e90f46c598b95eb450b823a35f3bb507b102d922d482c83252664214c3efb664723e513bae9e323b3a219eb6ec557a043a3b8ec23bcf5ad658a04822e1d39cdb08c6ca23febd8f29214abab
      APPWRITE_DATABASE_ID: main_db

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🟢 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/seed/package-lock.json

      - name: 📦 نصب وابستگی‌ها
        working-directory: backend/seed
        run: npm ci

      - name: 🩺 بررسی سلامت Appwrite
        # Health endpoint Appwrite نیاز به Project ID و API Key دارد.
        # اگر 401 یا خطا داد، ادامه می‌دهیم — migration خودش خطا می‌دهد اگر مشکل باشد.
        run: |
          HEALTH_CODE=$(curl -sS -o /dev/null -w "%{http_code}" \
            -H "X-Appwrite-Project: $APPWRITE_PROJECT_ID" \
            -H "X-Appwrite-Key: $APPWRITE_API_KEY" \
            "$APPWRITE_ENDPOINT/health" || echo "000")
          echo "Appwrite health: HTTP $HEALTH_CODE"
          if [ "$HEALTH_CODE" = "200" ]; then
            echo "✅ Appwrite در دسترس است"
          else
            echo "⚠️  health check غیرعادی — ادامه می‌دهیم"
            echo "   endpoint: $APPWRITE_ENDPOINT"
            echo "   project:  $APPWRITE_PROJECT_ID"
            echo "   (اگر migration شکست خورد، مشکل از اینجاست)"
          fi

      - name: 🗄 گام ۱/۳ — Migration (ساخت جداول wellness)
        if: github.event.inputs.skip_migration != 'true'
        working-directory: backend/seed
        run: |
          echo "▶ اجرای migrate-prompt-02.js ..."
          node migrate-prompt-02.js
          echo "✅ Migration تمام شد."

      - name: 📤 گام ۲/۳ — آپلود تصاویر + صوت
        if: github.event.inputs.skip_upload != 'true'
        working-directory: backend/seed
        run: |
          echo "▶ شمارش فایل‌ها برای آپلود ..."
          IMAGE_COUNT=$(find ../../artifacts/prompt-02-push/wellness-references -type f \( -name "*.jpg" -o -name "*.png" \) 2>/dev/null | wc -l)
          AUDIO_COUNT=$(find ../../artifacts/prompt-02-push/wellness-audio -type f -name "*.mp3" 2>/dev/null | wc -l)
          echo "  تصویر: $IMAGE_COUNT فایل"
          echo "  صوت:   $AUDIO_COUNT فایل"
          echo "  جمع:   $((IMAGE_COUNT + AUDIO_COUNT)) فایل"
          echo ""
          echo "▶ اجرای upload-wellness-assets.js ..."
          node upload-wellness-assets.js

      - name: 🌱 گام ۳/۳ — Seed ۴۳ حرکت به wellness_moves
        if: github.event.inputs.skip_seed != 'true'
        working-directory: backend/seed
        run: |
          echo "▶ اجرای seed-wellness-moves.js ..."
          node seed-wellness-moves.js
          echo "✅ Seed تمام شد."

      - name: ✅ تأیید نهایی
        if: always()
        run: |
          echo ""
          echo "═══════════════════════════════════════"
          echo "  📋 خلاصه‌ی deploy پرامپت ۰۲"
          echo "═══════════════════════════════════════"
          echo "  endpoint: $APPWRITE_ENDPOINT"
          echo "  project:  $APPWRITE_PROJECT_ID"
          echo "  database: $APPWRITE_DATABASE_ID"
          echo ""
          if [ "${{ github.event.inputs.skip_migration }}" != "true" ]; then
            echo "  ✅ migration: اجرا شد"
          else
            echo "  ⏭ migration: رد شد"
          fi
          if [ "${{ github.event.inputs.skip_upload }}" != "true" ]; then
            echo "  ✅ upload:   اجرا شد"
          else
            echo "  ⏭ upload:   رد شد"
          fi
          if [ "${{ github.event.inputs.skip_seed }}" != "true" ]; then
            echo "  ✅ seed:     اجرا شد"
          else
            echo "  ⏭ seed:     رد شد"
          fi
          echo "═══════════════════════════════════════"
