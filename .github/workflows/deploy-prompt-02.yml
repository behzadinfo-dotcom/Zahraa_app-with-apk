name: Deploy Prompt 02 (wellness)

# اجرای دستی deploy پرامپت ۰۲ (migration + آپلود + seed) روی Appwrite production.
# - ۳ گام: migrate → upload assets → seed moves
# - هر گام idempotent است (skip اگر موجود باشد)
# - می‌توان با workflow_dispatch دستی اجرا کرد

on:
  workflow_dispatch:
    inputs:
      skip_migration:
        description: 'اگر true، migration را اجرا نکن (فقط upload + seed)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      skip_upload:
        description: 'اگر true، آپلود فایل‌ها را انجام نده (فقط migration + seed)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      skip_seed:
        description: 'اگر true، seed کردن ۴۳ حرکت را انجام نده'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  deploy:
    name: deploy wellness (migrate + upload + seed)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      APPWRITE_ENDPOINT: https://fra.cloud.appwrite.io/v1
      APPWRITE_PROJECT_ID: 6a9d59e3002751cc3ea8
      APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
      APPWRITE_DATABASE_ID: ZahraDB

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🟢 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/seed/package-lock.json

      - name: 📦 نصب وابستگی‌ها
        working-directory: backend/seed
        run: npm ci

      - name: 🔐 بررسی APPWRITE_API_KEY
        id: preflight
        run: |
          if [ -z "$APPWRITE_API_KEY" ]; then
            echo "❌ GitHub Secret با نام APPWRITE_API_KEY تنظیم نشده یا خالی است."
            exit 1
          fi
          echo "✅ APPWRITE_API_KEY موجود است."

      - name: 🗄 گام ۱/۳ — Migration (ساخت database + جداول + bucket)
        id: migration
        if: github.event.inputs.skip_migration != 'true'
        working-directory: backend/seed
        run: |
          echo "▶ اجرای migrate-prompt-02.js ..."
          node migrate-prompt-02.js
          echo "✅ Migration تمام شد."

      - name: 📤 گام ۲/۳ — آپلود تصاویر + صوت
        id: upload
        if: github.event.inputs.skip_upload != 'true'
        working-directory: backend/seed
        run: |
          echo "▶ شمارش فایل‌ها برای آپلود ..."
          IMAGE_COUNT=$(find ../../artifacts/prompt-02-push/wellness-references -type f \( -name "*.jpg" -o -name "*.png" \) 2>/dev/null | wc -l)
          AUDIO_COUNT=$(find ../../artifacts/prompt-02-push/wellness-audio -type f -name "*.mp3" 2>/dev/null | wc -l)
          echo "  تصویر: $IMAGE_COUNT فایل"
          echo "  صوت:   $AUDIO_COUNT فایل"
          echo "  جمع:   $((IMAGE_COUNT + AUDIO_COUNT)) فایل"
          echo ""
          echo "▶ اجرای upload-wellness-assets.js ..."
          node upload-wellness-assets.js

      - name: 🌱 گام ۳/۳ — Seed ۴۳ حرکت به wellness_moves
        id: seed
        if: github.event.inputs.skip_seed != 'true'
        working-directory: backend/seed
        run: |
          echo "▶ اجرای seed-wellness-moves.js ..."
          node seed-wellness-moves.js
          echo "✅ Seed تمام شد."

      - name: ✅ تأیید نهایی
        if: always()
        run: |
          echo ""
          echo "═══════════════════════════════════════"
          echo "  📋 خلاصه‌ی deploy پرامپت ۰۲"
          echo "═══════════════════════════════════════"
          echo "  endpoint: $APPWRITE_ENDPOINT"
          echo "  project:  $APPWRITE_PROJECT_ID"
          echo "  database: $APPWRITE_DATABASE_ID"
          echo ""
          if [ "${{ steps.migration.outcome }}" = "success" ]; then
            echo "  ✅ migration: موفق"
          elif [ "${{ github.event.inputs.skip_migration }}" = "true" ]; then
            echo "  ⏭ migration: رد شد"
          elif [ "${{ steps.migration.outcome }}" = "skipped" ]; then
            echo "  ⏭ migration: به‌دلیل خطای پیش‌نیاز اجرا نشد"
          else
            echo "  ❌ migration: شکست خورد"
          fi
          if [ "${{ steps.upload.outcome }}" = "success" ]; then
            echo "  ✅ upload:   موفق"
          elif [ "${{ github.event.inputs.skip_upload }}" = "true" ]; then
            echo "  ⏭ upload:   رد شد"
          elif [ "${{ steps.upload.outcome }}" = "skipped" ]; then
            echo "  ⏭ upload:   به‌دلیل شکست migration اجرا نشد"
          else
            echo "  ❌ upload:   شکست خورد"
          fi
          if [ "${{ steps.seed.outcome }}" = "success" ]; then
            echo "  ✅ seed:     موفق"
          elif [ "${{ github.event.inputs.skip_seed }}" = "true" ]; then
            echo "  ⏭ seed:     رد شد"
          elif [ "${{ steps.seed.outcome }}" = "skipped" ]; then
            echo "  ⏭ seed:     به‌دلیل شکست مرحله‌ی قبلی اجرا نشد"
          else
            echo "  ❌ seed:     شکست خورد"
          fi
          echo "═══════════════════════════════════════"
          if [ "${{ steps.preflight.outcome }}" = "failure" ] || \
             [ "${{ steps.migration.outcome }}" = "failure" ] || \
             [ "${{ steps.upload.outcome }}" = "failure" ] || \
             [ "${{ steps.seed.outcome }}" = "failure" ]; then
            exit 1
          fi
